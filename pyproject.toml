[project]
name = "portfolio-analyzer"
version = "0.1.0"
description = "Streamlit portfolio analyzer: allocation and historical performance, priced with yfinance"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.50,<2", "pandas>=2.2,<3", "plotly>=6,<7", "yfinance>=0.2.65,<2", "rapidocr-onnxruntime>=1.4,<2", "pillow>=11,<13", "scipy>=1.15,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
